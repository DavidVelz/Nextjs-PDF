<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Resultados</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;margin:20px;color:#111}
    .section{margin-bottom:12px}
    .h{font-size:16px;font-weight:600;margin-bottom:6px}
    .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
    .label{color:#444}
    .value{font-weight:700}
  </style>
</head>
<body>
  <div class="section">
    <div class="h">Resultados generales</div>
    <div class="row"><div class="label">LpA (dB)</div><div class="value">{{LpA}}</div></div>
    <div class="row"><div class="label">Lw (dB)</div><div class="value">{{Lw}}</div></div>
  </div>
  <div class="section">
    <div class="h">Observaciones</div>
    <div>{{observations}}</div>
  </div>
</body>
</html>
